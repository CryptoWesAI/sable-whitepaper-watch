name: watch

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 so it never lines up with the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Run the watch
        id: watch
        run: |
          # The per-project pages are checked once a day (the 06:17 UTC run) and
          # on a manual run. The whitepaper and the status ledger run hourly.
          FLAGS=""
          if [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FLAGS="--peers"; fi
          python3 watch.py $FLAGS

      - name: Commit the record
        run: |
          git config user.name "sable-whitepaper-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            if [ "${{ steps.watch.outputs.changed }}" = "true" ]; then
              git commit -m "Whitepaper changed: ${{ steps.watch.outputs.summary }}"
            elif [ "${{ steps.watch.outputs.supply_fell }}" = "true" ]; then
              git commit -m "${{ steps.watch.outputs.supply_summary }}"
            elif [ -n "${{ steps.watch.outputs.conf_flip }}" ]; then
              git commit -m "${{ steps.watch.outputs.conf_summary }}"
            elif [ -n "${{ steps.watch.outputs.claim_flip }}" ]; then
              git commit -m "${{ steps.watch.outputs.claim_summary }}"
            else
              git commit -m "Status ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git pull --rebase origin main
            git push
          fi

      - name: Tell the phones (the Observatory app) that the whitepaper changed
        if: steps.watch.outputs.changed == 'true'
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          SUMMARY: ${{ steps.watch.outputs.summary }}
        run: |
          if [ -z "$PUSH_SECRET" ]; then echo "no PUSH_SECRET, no push"; exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          body = json.dumps({"title": "Sable's whitepaper changed", "body": (os.environ.get("SUMMARY") or "The hourly watcher saw a change. The Log has the diff.")[:200], "url": "/#log", "tag": "whitepaper"}).encode()
          req = urllib.request.Request("https://sable.primecircle.cloud/api/game/push/notify", data=body, headers={"Content-Type": "application/json", "x-push-secret": os.environ["PUSH_SECRET"]})
          try:
              print(urllib.request.urlopen(req, timeout=20).read().decode())
          except Exception as e:
              print("push failed:", type(e).__name__, e)
          EOF
      - name: Tell the phones that the SABL supply fell
        if: steps.watch.outputs.supply_fell == 'true'
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          SUMMARY: ${{ steps.watch.outputs.supply_summary }}
        run: |
          if [ -z "$PUSH_SECRET" ]; then echo "no PUSH_SECRET, no push"; exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          body = json.dumps({"title": "SABL supply fell on Solana", "body": (os.environ.get("SUMMARY") or "The hourly watcher saw the mint supply fall. The Token topic has the line.")[:200], "url": "/#token", "tag": "supply"}).encode()
          req = urllib.request.Request("https://sable.primecircle.cloud/api/game/push/notify", data=body, headers={"Content-Type": "application/json", "x-push-secret": os.environ["PUSH_SECRET"]})
          try:
              print(urllib.request.urlopen(req, timeout=20).read().decode())
          except Exception as e:
              print("push failed:", type(e).__name__, e)
          EOF
      - name: Tell the phones that the confidential tier flipped
        if: steps.watch.outputs.conf_flip != ''
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          FLIP: ${{ steps.watch.outputs.conf_flip }}
          SUMMARY: ${{ steps.watch.outputs.conf_summary }}
        run: |
          if [ -z "$PUSH_SECRET" ]; then echo "no PUSH_SECRET, no push"; exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          title = "Sable's confidential tier verified again" if os.environ.get("FLIP") == "recovered" else "Sable's confidential tier is failing closed"
          body = json.dumps({"title": title, "body": (os.environ.get("SUMMARY") or "The hourly watcher saw the confidential tier flip. The Log has the record.")[:200], "url": "/#log", "tag": "status"}).encode()
          req = urllib.request.Request("https://sable.primecircle.cloud/api/game/push/notify", data=body, headers={"Content-Type": "application/json", "x-push-secret": os.environ["PUSH_SECRET"]})
          try:
              print(urllib.request.urlopen(req, timeout=20).read().decode())
          except Exception as e:
              print("push failed:", type(e).__name__, e)
          EOF
      - name: Tell the phones that an announced route changed state
        if: steps.watch.outputs.claim_flip != ''
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          FLIP: ${{ steps.watch.outputs.claim_flip }}
          SUMMARY: ${{ steps.watch.outputs.claim_summary }}
        run: |
          if [ -z "$PUSH_SECRET" ]; then echo "no PUSH_SECRET, no push"; exit 0; fi
          python3 - <<'EOF'
          import json, os, urllib.request
          title = "An announced Sable route answers from outside" if os.environ.get("FLIP") == "reachable" else "An announced Sable route went away"
          body = json.dumps({"title": title, "body": (os.environ.get("SUMMARY") or "The hourly watcher saw an announced route change state. The Log has the record.")[:200], "url": "/#log", "tag": "claims"}).encode()
          req = urllib.request.Request("https://sable.primecircle.cloud/api/game/push/notify", data=body, headers={"Content-Type": "application/json", "x-push-secret": os.environ["PUSH_SECRET"]})
          try:
              print(urllib.request.urlopen(req, timeout=20).read().decode())
          except Exception as e:
              print("push failed:", type(e).__name__, e)
          EOF
      # No alert channel on purpose. The record is published as record.json in
      # this repository, and sable.primecircle.cloud reads it at page load, so
      # a change is visible on the site within the hour without any deploy.
