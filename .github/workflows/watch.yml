name: watch

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 so it never lines up with the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Run the watch
        id: watch
        run: |
          # The per-project pages are checked once a day (the 06:17 UTC run) and
          # on a manual run. The whitepaper and the status ledger run hourly.
          FLAGS=""
          if [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FLAGS="--peers"; fi
          python3 watch.py $FLAGS

      - name: Commit the record
        run: |
          git config user.name "sable-whitepaper-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            if [ "${{ steps.watch.outputs.changed }}" = "true" ]; then
              git commit -m "Whitepaper changed: ${{ steps.watch.outputs.summary }}"
            else
              git commit -m "Status ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git pull --rebase origin main
            git push
          fi
      # No alert channel on purpose. The record is published as record.json in
      # this repository, and sable.primecircle.cloud reads it at page load, so
      # a change is visible on the site within the hour without any deploy.
