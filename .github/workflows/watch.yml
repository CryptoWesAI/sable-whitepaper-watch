name: watch

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 so it never lines up with the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Run the watch
        id: watch
        run: python3 watch.py

      - name: Commit the record
        run: |
          git config user.name "sable-whitepaper-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            if [ "${{ steps.watch.outputs.changed }}" = "true" ]; then
              git commit -m "Whitepaper changed: ${{ steps.watch.outputs.summary }}"
            else
              git commit -m "Status ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git push
          fi

      - name: Telegram (only when the whitepaper or the signer changed)
        if: steps.watch.outputs.changed == 'true' || steps.watch.outputs.signer_changed == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.watch.outputs.summary }}
          SIGNER: ${{ steps.watch.outputs.signer_summary }}
          LABEL: ${{ steps.watch.outputs.label }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "no telegram secrets set, skipping"; exit 0; fi
          REPO="https://github.com/${{ github.repository }}"
          MSG="Sable whitepaper watch"
          [ -n "$SUMMARY" ] && MSG="$MSG%0A%0A$SUMMARY%0A$REPO/blob/main/diffs/$LABEL.diff"
          [ -n "$SIGNER" ]  && MSG="$MSG%0A%0A$SIGNER%0A$REPO/blob/main/status/log.jsonl"
          curl -s -o /dev/null -w "telegram: %{http_code}\n" \
            "https://api.telegram.org/bot$TOKEN/sendMessage?chat_id=$CHAT&disable_web_page_preview=true&text=$MSG"
